name: tests

on:
  push:
  pull_request:

jobs:
  plugin-obsidian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: plugin-obsidian
      - run: npx tsc --noEmit
        working-directory: plugin-obsidian
      - run: npm test
        working-directory: plugin-obsidian
      - run: npm run build
        working-directory: plugin-obsidian

  plugin-koreader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check all Lua files
        working-directory: plugin-koreader/provider-konotes.koplugin
        run: for f in main.lua target.lua payload.lua _meta.lua; do lua5.4 -e "assert(loadfile('$f'))"; done
      - name: Payload spec
        working-directory: plugin-koreader/provider-konotes.koplugin
        run: lua5.4 spec/payload_test.lua
